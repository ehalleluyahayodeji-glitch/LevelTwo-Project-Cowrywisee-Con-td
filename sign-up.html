<body>
    <div class="login">
        <div class="logo-image">
            <img src="download (2).svg" alt="">

        <div class="container">
            <div class="journey">
                <h3>Start your investment journey</h3>
                <span>Got an account?<a href="Login.html"> Sign In</a></span>
                <div id="google">
                    <button onclick="signGo()"><img src="download (4).svg" alt="">Sign up with Google</button>
                </div>
                <div class="divider">
                    <hr>
                    <span>or</span>
                    <hr>
                </div>
                <div class="emailContainer">
                    <input type="email" placeholder="Email Address" required id="getUserEmail" class="emailInput">
                    <label for="getUserEmail" class="emailLabel">Email Address</label>
                    <div id="showEmail"><i class="fa-solid fa-circle-exclamation"></i></div>
                </div>
                <div class="plate">
                    <div class="plate-1">
                        <div class="emailContainer">
                            <input type="text" placeholder="Legal FIrst Name" required id="getUserFirstName"
                                class="emailInput">
                            <label for="getUserFirstName" class="emailLabel">Legal First Name</label>
                        </div>
                        <div id="toast"></div>
                        <div class="emailContainer">
                            <input type="text" placeholder="Legal Last Name" required id="getUserLastName"
                                class="emailInput">
                            <label for="getUserLastName" class="emailLabel">Legal Last Name</label>
                        </div>
                    </div>
                    <div class="plate-1">
                        <div class="emailContainer">
                            <input type="text" placeholder="@username" required id="getUserUsername" class="emailInput">
                            <label for="getUserUsername" class="emailLabel">@username</label>
                        </div>
                        <div class="emailContainer">
                            <input type="number" placeholder="Phone Number" required id="getUserPhone"
                                class="emailInput">
                            <label for="getUserPhone" class="emailLabel">Phone Number</label>
                        </div>
                    </div>
                    <div class="plate-1">
                        <div class="emailContainer">
                            <input type="password" placeholder="Password" required id="getUserPassword"
                                class="emailInput">
                            <label for="getUserPassword" class="emailLabel">Password</label>
                        </div>
                        <div class="emailContainer">
                            <input type="password" placeholder="Confirm Password" required id="getUserConfirmPassword"
                                class="emailInput">
                            <label for="getUserConfirmPassword" class="emailLabel">Confirm Password</label>
                        </div>
                    </div>
                </div>
                <button id="continueBtn" class="continue">Continue</button>
                <div class="cowrywise">
                    <span><img src="imgi_1_sec-logo.uViKvy1J.png" alt="" width="15px">Cowrywise is licensed by the
                        SEC</span>

            </div>
            <div class="start">
                <h5>Don’t wait to start</h5>
                <p>See how much you could have earned in the past few years</p>
                <a href=""><img src="download (7).svg" alt="">See what you missed <img src="download (9).svg"
                        alt=""></a>

        </div>
        <div class="cover-image">
            <img src="imgi_13_auth-bg.svg" alt="">

        <img src="imgi_2_a5971d1b1fbb04e757204fbf07553916.png" alt="" width="40px" class="itheme">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBq-i-3bUhkrTpzyaDAOGOP8lmAD3rHuNM",
        authDomain: "cowrywise-leveltwo-project.firebaseapp.com",
        projectId: "cowrywise-leveltwo-project",
        storageBucket: "cowrywise-leveltwo-project.firebasestorage.app",
        messagingSenderId: "369383270880",
        appId: "1:369383270880:web:c7cec0f50482d9ba96a385",
        measurementId: "G-NMDP7SJSQ9"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();


    const signGo = () => {
        signInWithPopup(auth, provider)
            .then((result) => {
                const user = result.user;
                console.log(user);

                const googleUser = {
                    email: user.email || '',
                    user_first_name: user.displayName ? user.displayName.split(' ')[0] : '',
                    user_last_name: user.displayName ? user.displayName.split(' ').slice(1).join(' ') : '',
                    user_name: user.email ? `@${user.email.split('@')[0]}` : '',
                    user_phone_number: '',
                    user_password: '',
                    balance: '1000.00',
                    pin: '0000'
                };

                if (typeof syncUserSession === 'function') {
                    syncUserSession(googleUser);
                }

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1500);
            })
            .catch((error) => {
                const errorCode = error.code;
                const errorMessage = error.message;
                console.log(errorCode);
                console.log(errorMessage);
            })
    }
    window.signGo = signGo
</script>
